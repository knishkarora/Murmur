name: Pre-warm Render Backend

on:
  workflow_dispatch: # Triggered on exact schedule via GitHub API by cron-job.org or manually from GitHub UI

jobs:
  pre-warm:
    name: Wake up Render Service
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          URL="https://murmur-86lm.onrender.com/health?format=text"
          MAX_ATTEMPTS=5
          SLEEP_SECONDS=15

          echo "Initiating pre-warming request for: $URL"

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "--- Attempt $attempt of $MAX_ATTEMPTS ---"
            
            # Send HTTP request with up to 90-second timeout to safely
            # accommodate Render free-tier cold boot (~50-65s)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL") || HTTP_CODE="000"
            echo "Response status code: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Success: Render instance is awake and responsive!"
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Instance is booting up. Retrying in ${SLEEP_SECONDS}s..."
              sleep $SLEEP_SECONDS
            fi
          done

          echo "❌ Error: Render service did not return 200 OK within $MAX_ATTEMPTS attempts."
          exit 1
